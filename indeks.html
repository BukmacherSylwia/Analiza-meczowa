<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocena Meczów</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #219653;
        }
        .match-list {
            margin-top: 25px;
        }
        .match-card {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 5px solid #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ocena Meczów</h1>
    
    <div class="form-group">
        <label for="sport">Wybierz sport:</label>
        <select id="sport">
            <option value="Piłka nożna">Piłka nożna</option>
            <option value="Tenis">Tenis</option>
        </select>
    </div>

    <div class="form-group">
        <label for="teams">Drużyny / Zawodnicy:</label>
        <input type="text" id="teams" placeholder="np. Real - Barcelona / Alcaraz - Sinner">
    </div>

    <div class="form-group">
        <label for="rating">Ocena (1-10):</label>
        <input type="number" id="rating" min="1" max="10" value="8">
    </div>

    <div class="form-group">
        <label for="comment">Komentarz / Notatka:</label>
        <textarea id="comment" rows="3" placeholder="Twoje wrażenia z meczu..."></textarea>
    </div>

    <button onclick="addMatch()">Zapisz mecz</button>

    <div class="match-list">
        <h3>Twoje oceny:</h3>
        <div id="matchesContainer">Brak zapisanych meczów.</div>
    </div>
</div>

<script>
    function addMatch() {
        const sport = document.getElementById('sport').value;
        const teams = document.getElementById('teams').value;
        const rating = document.getElementById('rating').value;
        const comment = document.getElementById('comment').value;

        if (!teams) {
            alert('Wpisz drużyny lub zawodników!');
            return;
        }

        const container = document.getElementById('matchesContainer');
        
        if (container.innerHTML === 'Brak zapisanych meczów.') {
            container.innerHTML = '';
        }

        const matchCard = document.createElement('div');
        matchCard.className = 'match-card';
        matchCard.innerHTML = `
            <strong>${sport}</strong>: ${teams}<br>
            Ocena: <strong>${rating}/10</strong><br>
            <small>${comment}</small>
        `;

        container.prepend(matchCard);

        // Czyszczenie formularza
        document.getElementById('teams').value = '';
        document.getElementById('comment').value = '';
    }
</script>

</body>
</html>
